<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Yaris Rift Report</title>
<style>
:root { --bg: #f7f7f5; --panel: #fff; --fg: #1d1f23; --muted: #676b73; --line: #e3e3df; --bad: #c43d3d; --accent: #3b6fd8; }
@media (prefers-color-scheme: dark) { :root { --bg: #15171b; --panel: #1d2026; --fg: #e8e9ec; --muted: #9a9ea8; --line: #2e323a; --bad: #ee6b6b; --accent: #6b98f0; color-scheme: dark; } }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { min-height: 100%; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
form { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 24px; display: grid; gap: 12px; width: min(100%, 320px); }
h1 { margin: 0; font: 400 26px/1.2 Georgia, serif; }
p { margin: 0; color: var(--muted); font-size: 13px; }
input { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); letter-spacing: .2em; }
button { font: inherit; padding: 8px 10px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.err { color: var(--bad); min-height: 1.2em; }
</style>
</head>
<body>
<main>
  <form id="f">
    <h1>Yaris Rift Report</h1>
    <p>Enter the password to open the dashboard.</p>
    <input id="pw" type="password" inputmode="numeric" autocomplete="current-password" aria-label="Password" autofocus>
    <button id="go" type="submit">Open</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>

async function unlock(pw) {

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value, btn = document.getElementById('go'), err = document.getElementById('err');

  try {
    const html = await unlock(pw);
    try { sessionStorage.setItem('rift-pw', pw); } catch (e) {}
    show(html);
  } catch (e) {
    err.textContent = 'Wrong password.'; btn.disabled = false;
  }
});
